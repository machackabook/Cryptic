[package]
name = "cryptic-axs-backend"
version = "0.1.0"
edition = "2021"
description = "Loopback-only authenticated persistent PTY and event bridge for Cryptic / AXS"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
hex = "0.4"
portable-pty = "0.8"
rand = "0.8"
serde_json = "1"
subtle = "2"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.21"
