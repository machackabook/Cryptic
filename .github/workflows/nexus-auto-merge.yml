name: NEXUS Gated Auto Merge
on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
  status:
  workflow_dispatch:
    inputs:
      pr_number:
        type: number
        required: true
permissions:
  contents: read
  pull-requests: write
  statuses: read
jobs:
  consider:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name != 'status' || github.event.context == 'nexus/session-authorized'
    steps:
      - name: Inspect GitHub protection, session receipt and independent review
        uses: actions/github-script@v7
        env:
          ATTESTOR_LOGIN: ${{ vars.NEXUS_ATTESTOR_LOGIN }}
          ATTESTOR_APP_ID: ${{ vars.NEXUS_ATTESTOR_APP_ID }}
        with:
          script: |
            const owner=context.repo.owner,repo=context.repo.repo;
            const login=process.env.ATTESTOR_LOGIN||'';
            const appId=Number(process.env.ATTESTOR_APP_ID||0);
            if(!login.endsWith('[bot]')||!Number.isInteger(appId)||appId<=0){core.warning('Attestation App not configured: no auto-merge');return;}
            const rulesets=(await github.request('GET /repos/{owner}/{repo}/rulesets',{owner,repo})).data;
            let protectedByRequiredChecks=false;
            for(const r of rulesets){
              if(r.enforcement!=='active'||r.target!=='branch')continue;
              const full=(await github.request('GET /repos/{owner}/{repo}/rulesets/{ruleset_id}',{owner,repo,ruleset_id:r.id})).data;
              const branches=full.conditions?.ref_name?.include||[];
              if(!branches.includes('~DEFAULT_BRANCH')&&!branches.includes('refs/heads/main'))continue;
              const checks=full.rules?.find(x=>x.type==='required_status_checks')?.parameters?.required_status_checks||[];
              const required=new Set(checks.map(x=>x.context));
              if(full.rules.some(x=>x.type==='pull_request')&&required.has('nexus-session-attested')
                 && checks.some(x=>x.context==='nexus/session-authorized'&&x.integration_id===appId)
                 && (required.has('nexus-react-ci')||required.has('nexus-backend-ci')))protectedByRequiredChecks=true;
            }
            if(!protectedByRequiredChecks){core.warning('Required signed-App ruleset not verified: no auto-merge');return;}
            let candidates=[];
            if(context.eventName==='pull_request_target')candidates=[context.payload.pull_request];
            else {
              const open=(await github.rest.pulls.list({owner,repo,state:'open',per_page:100})).data;
              if(context.eventName==='status')candidates=open.filter(x=>x.head.sha===context.payload.sha);
              else candidates=open.filter(x=>x.number===Number(context.payload.inputs.pr_number));
            }
            for(const pr of candidates){
              if(pr.draft||pr.base.ref!=='main'||pr.head.repo.full_name!==owner+'/'+repo)continue;
              const statuses=(await github.rest.repos.listCommitStatusesForRef({owner,repo,ref:pr.head.sha,per_page:100})).data;
              const s=statuses.find(x=>x.context==='nexus/session-authorized');
              if(!s||s.state!=='success'||s.creator?.login!==login)continue;
              const reviews=(await github.rest.pulls.listReviews({owner,repo,pull_number:pr.number,per_page:100})).data;
              const latest=new Map(reviews.map(x=>[x.user.login,x.state]));
              if(![...latest].some(([reviewer,state])=>reviewer!==pr.user.login&&state==='APPROVED'))continue;
              try {
                await github.graphql('mutation($id:ID!){enablePullRequestAutoMerge(input:{pullRequestId:$id,mergeMethod:SQUASH}){clientMutationId}}',{id:pr.node_id});
                core.info('Eligible reviewed, signed PR #'+pr.number+' enrolled in auto-merge. GitHub required checks remain authoritative.');
              } catch(e){core.warning('Auto-merge remains disabled for #'+pr.number+': '+e.message);}
            }
