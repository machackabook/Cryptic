name: cascade-enhance
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  lint-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v5.6.0
        with:
          python-version: '3.12'
      - name: runtime security regression tests
        run: node --test tests/security.test.mjs
      - name: public surface and control-wiring regression tests
        run: node --test tests/public-surface.test.mjs
      - name: SSH identity and HULE/LACE regression tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: secret-pattern and source verification
        run: node scripts/verify.mjs
      - name: require README and SECURITY
        run: test -f README.md && test -f SECURITY.md
      - name: stamp present
        run: test -f docs/LEDGER-STAMP.md
      - name: numeral remembered in README
        run: grep -q 137451921129154222 README.md
      - name: no obvious secret files in tree
        run: |
          ! test -f .env
          ! test -f secrets.yml
          ! test -f id_rsa
