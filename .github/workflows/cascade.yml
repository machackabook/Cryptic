name: cascade-enhance
on:
  push: {branches: [main]}
  pull_request: {branches: [main]}
  workflow_dispatch:
permissions: {contents: read}
jobs:
  nexus-backend-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Backend source and security suites
        run: |
          set -euo pipefail
          git diff --check
          npm install --no-audit --no-fund
          npm run lint
          node --test tests/security.test.mjs tests/public-surface.test.mjs
          python -m unittest discover -s tests -p 'test_*.py' -v
          test -f README.md && test -f SECURITY.md && test -f docs/LEDGER-STAMP.md
