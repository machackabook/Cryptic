name: Cryptic Pages Sentinel Security
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: cryptic-pages-security-${{ github.ref }}
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.6.0
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # pinned action commit
        with:
          components: rustfmt
      - name: Verify source syntax
        run: |
          set -eu
          git diff --check
          git ls-files -z '*.js' '*.mjs' '*.cjs' | xargs -0 -r -n1 node --check
      - name: Run production-source security regression suite
        run: |
          npm run lint
          npm run test:security
          npm test
          npm run build
          node --test tests/public-surface.test.mjs
          python -m unittest discover -s tests -p 'test_*.py' -v
          cargo fmt --manifest-path axs-backend/Cargo.toml -- --check
          cargo check --manifest-path axs-backend/Cargo.toml
      - name: Record revision and changed-file evidence
        run: node scripts/security-diff.mjs
      - name: Validate AI denial policy and publication boundaries
        run: |
          node -e "const p=require('./.well-known/ai-access-policy.json'); if(p.ai_access?.default!=='denied'||p.authorization?.status!=='backend-enforcement-required')process.exit(1)"
          grep -q '^User-agent: \*' robots.txt
          grep -q '^Disallow: /' robots.txt
          grep -q 'robots.txt.*not.*origin' AI-ACCESS-POLICY.md || test -f docs/SECURITY-BACKLOG-10OF10.md
      - name: Audit current Cryptic source
        run: node scripts/pages-security-audit.mjs --local-only
      - name: Audit public GitHub Pages across owners
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PAGES_AUDIT_OWNERS: machackabook,Azazeleous,crypticmetaverse,thearchitectofgaia-boop
        run: node scripts/pages-security-audit.mjs --fleet
      - name: Upload scanner and source-diff evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cryptic-pages-security-${{ github.run_id }}
          path: reports/security/
          if-no-files-found: warn
          retention-days: 30
