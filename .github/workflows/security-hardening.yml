name: Cryptic security hardening
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cryptic-security-hardening-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Run build and security regression suites
        run: |
          npm run build
          npm test
          node scripts/pages-security-audit.mjs --local-only
          node scripts/network-security.mjs
          git diff --check
      - name: Record source evidence
        if: always()
        run: |
          node scripts/security-diff.mjs
          node scripts/evidence-manifest.mjs
      - name: Upload security evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cryptic-security-${{ github.run_id }}
          path: reports/security/
          if-no-files-found: error
          retention-days: 30
