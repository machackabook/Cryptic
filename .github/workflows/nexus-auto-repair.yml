name: NEXUS Bounded Auto Repair
on:
  workflow_run:
    workflows: [cascade-enhance, Cryptic Pages Sentinel Security]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: nexus-autorepair-main
  cancel-in-progress: false
jobs:
  propose-only:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Apply allowlisted compatibility remedy on trusted main ONLY
        run: |
          node --check scripts/nexus-ci-remedy.mjs
          node scripts/nexus-ci-remedy.mjs --apply
          git diff --check
      - name: Create a reviewable repair PR, never write directly to main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet; then echo 'No approved deterministic repair. Human triage required for unknown failures.'; exit 0; fi
          branch="autofix/nexus-ci-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add .github/workflows/cascade.yml .github/workflows/pages-security.yml
          git diff --cached --check
          git commit -m "fix(ci): approved runtime compatibility remediation"
          gh auth setup-git
          git push origin "$branch"
          gh pr create --base main --head "$branch" --title "fix(ci): bounded NEXUS workflow remedy" --body "Generated by an allowlisted deterministic transformation of trusted main. This proposal is NOT session-attested, cannot self-approve, and must pass independent ADAM gates before merge."
