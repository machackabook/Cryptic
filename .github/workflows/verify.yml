name: verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  evidence-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Clone public repository
        run: git clone --depth 1 https://github.com/machackabook/Cryptic.git repo
      - name: Run Cryptic evidence gate
        run: cd repo && node scripts/verify.mjs
